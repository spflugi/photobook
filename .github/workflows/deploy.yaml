# Builds a production release and publishes the NSIS installer.
#
# Triggers:
#   - Push of a version tag (v*.*.*) — the standard release flow
#   - Manual workflow_dispatch — for ad-hoc releases from any ref
#
# Outputs:
#   - GitHub Release with the installer attached (permanent, downloadable)
#   - GitHub Actions artifact (90-day retention, useful for audit/rollback)

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3) — created if it does not exist'
        required: true

jobs:
  release:
    name: Build & release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Puts the MSVC link.exe first in PATH, overriding Git's link.exe.
      # CARGO_TARGET_… env var below also overrides the hardcoded path in
      # src-tauri/.cargo/config.toml (which points to the local dev machine).
      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node dependencies
        run: npm ci

      # Frontend must be built before cargo runs (generate_context! reads dist/)
      - name: Build Tauri release app
        env:
          # Overrides the absolute local path in src-tauri/.cargo/config.toml
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: npm run tauri build

      # Extract version from Cargo.toml to name the release consistently
      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Create a GitHub Release and attach the NSIS installer as a release asset.
      # GITHUB_TOKEN is automatically provided — no extra secret needed.
      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhotoBook ${{ steps.tag.outputs.tag }}
          body: |
            ## PhotoBook ${{ steps.tag.outputs.tag }}

            ### Installation
            Download **PhotoBook_${{ steps.version.outputs.version }}_x64-setup.exe** and run it.

            ### Requirements
            - Windows 10 / 11 (x64)
            - WebView2 runtime (included in Windows 11; the installer will prompt on Windows 10)
          files: src-tauri/target/release/bundle/nsis/PhotoBook_*_x64-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also upload as a workflow artifact for 90-day audit trail / rollback access.
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBook-${{ steps.version.outputs.version }}-installer
          path: src-tauri/target/release/bundle/nsis/PhotoBook_*_x64-setup.exe
          retention-days: 90
